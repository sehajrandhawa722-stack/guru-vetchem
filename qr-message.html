<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Connection timed out</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#202124}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 26px}
.wrap{width:min(560px,100%);margin:18vh auto 0}
.icon{width:72px;height:72px;margin-bottom:28px;position:relative}
.icon:before{content:"";position:absolute;inset:5px;border:3px solid #5f6368;border-radius:50%}
.icon:after{content:"!";position:absolute;inset:0;display:grid;place-items:center;font-size:36px;font-weight:600;color:#5f6368;transform:translateY(-1px)}
h1{font-size:30px;line-height:1.25;font-weight:500;margin:0 0 18px;letter-spacing:-.2px}
p{font-size:16px;line-height:1.55;margin:0 0 12px;color:#5f6368}
ul{margin:10px 0 20px;padding-left:22px;color:#5f6368;font-size:16px;line-height:1.6}
.code{margin-top:24px;font-size:13px;letter-spacing:.2px;color:#6f7378}
button{margin-top:28px;border:0;border-radius:22px;background:#1a73e8;color:#fff;font-size:15px;font-weight:600;padding:11px 23px;min-width:96px}
button:active{transform:scale(.98)}
@media(max-width:420px){.wrap{margin-top:15vh}.icon{width:64px;height:64px}h1{font-size:27px}}
</style>
</head>
<body>
<main class="wrap" role="alert">
<div class="icon" aria-hidden="true"></div>
<h1>This page isn’t responding</h1>
<p>The server took too long to respond.</p>
<p>Try:</p>
<ul>
<li>Checking your connection</li>
<li>Turning off VPN or proxy services</li>
<li>Trying again in a few minutes</li>
</ul>
<div class="code">ERR_CONNECTION_TIMED_OUT</div>
<button type="button" onclick="location.reload()">Reload</button>
</main>
</body>
</html>
